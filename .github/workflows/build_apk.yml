name: Build CricPrism APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Prepare Clean Flutter Android Project
        run: |
          mkdir -p /tmp/cric_code
          cp lib/main.dart /tmp/cric_code/
          rm -rf * .[^.]* || true
          
          # Fresh Flutter Project create karein
          flutter create --org com.cricprism --project-name cricprism .
          cp /tmp/cric_code/main.dart lib/main.dart
          
          # Packages add karein
          flutter pub add camera flutter_tts cupertino_icons

      - name: Patch Android Config
        run: |
          # minSdk 21 fix
          find android/app -name "build.gradle*" -exec sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' {} +
          
          # Camera and Audio permissions inject
          sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricPrism-Release-APK
          path: build/app/outputs/flutter-apk/*.apk
